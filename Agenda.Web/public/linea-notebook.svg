<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160" fill="none">
  <style>
    .leaf { transform-origin: 100px 80px; animation: turn 2.8s ease-in-out infinite; }
    .leaf-two { animation-delay: -.22s; }
    .leaf-three { animation-delay: -.44s; }
